name: Pylint, unit tests, and approval tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install .
    - name: Analysing the code with pylint
      run: |
        export PYLINTRC=./.github/workflows/.pylintrc
        pylint $(find ./vesmod/VesEdge -name '*.py') --fail-under=8
        pylint $(find ./vesmod/EdgeMod -name '*.py') --fail-under=8
        pylint $(find ./vesmod/cli -name '*.py') --fail-under=8

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install .
    - name: Running unit tests with pytest
      run: |
        python -m pytest ./tests/unit_tests/test*.py

  approval-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install .
    - name: Running approval tests with pytest
      run: |
        python -m pytest ./tests/test_edge_extractor_quality.py
    - name: Running end-to-end acceptance test with pytest
      run: |
        python -m pytest ./tests/test_end_to_end_acceptance.py
