name: Pylint and regression test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nd2 scipy opencv-python scikit-image numpy matplotlib lmfit
        pip install pylint
        pip install pytest
        pip install .
    - name: Analysing the code with pylint
      run: |
        export PYLINTRC=./.github/workflows/.pylintrc
        pylint $(find ./vesmod/VesEdge -name '*.py') --fail-under=8
        pylint $(find ./vesmod/EdgeMod -name '*.py') --fail-under=6
    - name: Running regression test with pytest
      run: |
        python -m pytest ./tests/test_edge_extractor_quality.py
